# GORM Database 配置示例文件
# 将此文件保存为 database.yaml 并在应用中加载（如配合 viper），字段说明见行内注释
# 对应结构体：database.MysqlConfig（模块 github.com/xm-utils/tools/gorm/database）
#
# 结构变更提示：连接相关字段（host/port/user/pwd/database/charset/location）已从顶层
# 下沉到 db_master 节点；顶层不再有 db_name/db_user/db_pwd/db_host/db_port/db_charset/
# db_location，也已移除 db_alias、db_log_dir。主库(db_master)与每个从库(db_slaves 元素)
# 都是同一种「节点配置」，各自提供完整连接信息（当前实现不再自动继承主库凭证）。

# ==================== 主库（必填，唯一写库） ====================
# 对应 MysqlConfig.Master (*MysqlNodeConfig)，yaml 前缀 db_master
# 必填：user / host / port / database（缺失时 InitGorm/openDB 返回明确 error，不会连库后才报晦涩错误）
# 允许为空：pwd（部分环境允许空密码）；charset/location 留空使用默认值
db_master:
  host: "127.0.0.1"          # 数据库IP（域名）（必填）
  port: "3306"               # 数据库端口（必填）
  user: "root"               # 数据库连接用户名（必填）
  pwd: "password"            # 数据库连接密码
  database: "mydb"           # 数据库名称（必填）
  charset: "utf8mb4"         # 字符集类型，留空默认 utf8mb4
  location: "Asia/Shanghai"  # 时区，留空默认 Local

# ==================== 全局调试 / 表前缀（MysqlConfig 顶层） ====================
db_debug: "false"             # 是否调试模式："true" 打印 SQL 日志（注意是字符串，非 bool）
db_table_prefix: ""           # 表前缀，如 "app_" 时模型表名 users -> app_users

# ==================== 连接池配置（均可留空，使用括号内默认值） ====================
db_max_idle_conns: 10         # 最大空闲连接数（默认 10）
db_max_open_conns: 100        # 最大打开连接数（默认 100）
db_conn_max_lifetime: 3600    # 连接最大存活时间/秒（默认 3600）
db_conn_max_idle_time: 600    # 连接最大空闲时间/秒（默认 600）

# ==================== 一主多从读写分离（可选，整段省略则全部读写走主库） ====================
# db_slaves 为读节点（从）列表，元素结构与 db_master 相同（MysqlNodeConfig）。
# 注意：每个从库需自行填写完整连接信息（host/port/user/pwd/database）；
#       当前实现不再自动继承主库凭证，charset/location 留空则各从库使用默认值。
# 另外：模型需实现 ReplicaReader 接口并经 database.RegisterModels 注册，其表读操作才会走从库；
#       未声明的表读写仍全部走主库（详见 README「仅部分表读走从库」）。
db_slaves:
  - host: "10.0.1.1"          # 数据库IP（域名）
    port: "3306"              # 数据库端口
    user: "root"              # 用户名
    pwd: "password"           # 密码
    database: "mydb"          # 库名
    charset: ""               # 字符集，留空默认 utf8mb4
    location: ""              # 时区，留空默认 Local
  - host: "10.0.1.2"
    port: "3306"
    user: "root"
    pwd: "password"
    database: "mydb"
  # 更多从库可继续追加，读请求由 RandomPolicy 在从库间随机负载均衡

# 多从场景下连接池参数会同时下发到主连接与每个从库连接池（每个从库独立一套）。

# ==================== 单库最简配置（只保留主库，其余全部省略） ====================
# db_master:
#   host: "127.0.0.1"
#   port: "3306"
#   user: "root"
#   pwd: "password"
#   database: "mydb"


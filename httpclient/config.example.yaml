#   package main
#
#   import (
#       "log"
#       "os"
#
#       "github.com/xm-utils/tools/httpclient"
#       "gopkg.in/yaml.v3"
#   )
#
#   type appConfig struct {
#       HTTPClient *httpclient.Config `yaml:"httpclient"`
#   }
#
#   func main() {
#       bs, err := os.ReadFile("config.yaml")
#       if err != nil {
#           log.Fatal(err)
#       }
#       var cfg appConfig
#       if err := yaml.Unmarshal(bs, &cfg); err != nil {
#           log.Fatal(err)
#       }
#       // cnf 为 nil 时 Init 内部会退化为 DefaultConfig()，因此整段缺失不会 panic
#       // 但整段存在而单字段缺失时，该字段是 Go 零值（见上方说明）
#       httpclient.Init(cfg.HTTPClient, nil)
#   }

#   注意两种“缺失”的区别：
#     - 整段 httpclient: 缺失 → cfg.HTTPClient 为 nil → Init 内部退化为 DefaultConfig()
#     - 段存在但某个键缺失 → 该字段保持 Go 零值，Timeout 会变成 0（即不超时）
#       需要默认值时不要删字段，或改用方案 B

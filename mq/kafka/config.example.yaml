# mq/kafka 配置模板
#
# 适配器直接复用底层组件配置结构体：NewProducer 收 tools/mq/kafka/client.ProducerConfig，
# NewConsumer 收 tools/mq/kafka/client.ConsumerConfig（yaml tag 一一对应）。
# 门面层没有统一 YAML 加载入口，业务可用 viper/yaml 反序列化后映射到上述结构体。

kafka:
  # ---------- 生产者（tools/mq/kafka/client.ProducerConfig） ----------
  producer:
    brokers: ["localhost:9092"]
    client_id: order-service
    max_attempts: 3
    batch_size: 1000
    batch_bytes: 10485760        # 10MB
    read_timeout: 10s
    write_timeout: 10s
    dial_timeout: 10s
    allow_auto_topic_creation: false

  # ---------- 消费者（tools/mq/kafka/client.ConsumerConfig） ----------
  consumer:
    brokers: ["localhost:9092"]
    client_id: order-service
    group_id: order-service      # 可被 Subscribe(ctx, group, ...) 参数覆盖
    topic: orders                # 订阅时以 Subscribe 的 topic 参数为准
    min_bytes: 1
    max_bytes: 10485760
    max_wait: 1s
    heartbeat_interval: 3s
    session_timeout: 30s
    rebalance_timeout: 30s
    start_offset: -2             # -2=FirstOffset, -1=LastOffset
    queue_capacity: 1000
    # 以下三项由适配器强制改写为手动提交模式，配置值仅作占位：
    #   auto_commit: false（须保持 false）
    #   group_id / topic：以 Subscribe 参数为准

  # ---------- Consumer 装配项（代码内 Option，非 yaml 结构体字段） ----------
  consumer_options:
    max_requeue: 3               # WithMaxRequeue：Handler 失败就地重投额度，0 取默认 3，负数关闭
    # WithRequeueProducer（独立 write-only Producer，仅重投路径使用）、
    # WithRejected（终态丢弃钩子）、WithLogger 为代码注入，无 yaml 形态
